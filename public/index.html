<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Análise de Partidas - Stockfish</title>
  
  <!-- Ícone do navegador (Flaticon) -->
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/823/823485.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* 1. IDENTIDADE VISUAL DARK / CINEMÁTICA / VERMELHO SANGUE */
    body {
      background-color: #0a0a0a; 
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    .panel-bg { background-color: #111111; }
    .panel-dark { background-color: #1a1a1a; }
    .border-subtle { border-color: #2b2b2b; }

    .text-highlight { color: #e30000; }
    .bg-highlight { background-color: #e30000; }
    .hover-bg-highlight:hover { background-color: #ff1a1a; }
    .border-highlight { border-color: #e30000; }

    /* Estilos do Tabuleiro */
    .white-1e1d7 { background-color: #4a4a4a !important; color: #2b2b2b !important; }
    .black-3c85d { background-color: #2b2b2b !important; color: #4a4a4a !important; }

    #board-wrapper {
      box-shadow: 0 0 20px rgba(227, 0, 0, 0.15);
    }

    .highlight-move {
      box-shadow: inset 0 0 0 100px rgba(227, 0, 0, 0.3) !important;
    }

    .piece-classification-badge {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      pointer-events: none;
      user-select: none;
      transition: all 0.15s ease;
      z-index: 30; 
    }

    /* 2. OVERLAY MODO VARIANTE */
    #variant-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.15);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    
    #board-wrapper.variant-active #variant-overlay {
      opacity: 1;
    }

    #board .piece-417db { 
      position: relative;
      z-index: 15; 
    }

    /* 3. OVERLAY SETAS */
    #custom-arrow-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2b2b2b; border-radius: 3px; }
  </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex flex-col">

  <header class="panel-bg border-b border-subtle px-6 py-3 shrink-0 flex items-center justify-between z-10 shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded bg-highlight flex items-center justify-center text-white font-bold text-lg shadow-md">♞</div>
      <span class="text-white font-bold tracking-wide text-lg uppercase letter-spacing-1">CHESS<span class="text-highlight">ANALYZER</span></span>
    </div>
    <div class="flex items-center gap-3">
      <span class="hidden sm:inline text-xs text-gray-500">Arraste peças • Botão direito desenha setas</span>
      <button onclick="openPgnModal()" class="bg-highlight hover-bg-highlight text-white font-semibold px-4 py-1.5 rounded text-sm transition cursor-pointer shadow">
        + Colar PGN
      </button>
    </div>
  </header>

  <main class="flex-1 w-full max-w-[1500px] mx-auto px-4 py-3 grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6 min-h-0 overflow-hidden">
    
    <!-- Coluna Esquerda: Tabuleiro -->
    <div class="lg:col-span-7 flex flex-col items-center justify-center min-h-0 h-full w-full">
      <div class="w-full flex flex-col h-full justify-center max-w-[75vh]">

        <div id="top-player-bar" class="flex items-center justify-between py-1.5 px-1 shrink-0">
          <div class="flex items-center gap-2.5">
            <div id="top-avatar" class="w-8 h-8 rounded bg-[#1a1a1a] flex items-center justify-center text-white font-bold text-sm border border-subtle">N</div>
            <div>
              <div id="top-name" class="text-white font-semibold text-sm leading-tight">Negras</div>
              <div id="top-elo" class="text-xs text-gray-500">Rating: ?</div>
            </div>
          </div>
          <div id="top-badge" class="text-xs px-2 py-0.5 rounded bg-[#111111] border border-subtle text-gray-400"></div>
        </div>

        <div class="flex items-stretch gap-2.5 flex-1 min-h-0 min-w-0">
          <div class="w-6 lg:w-7 bg-[#111111] rounded overflow-hidden relative shrink-0 border border-subtle select-none shadow-lg">
            <div id="eval-bar-black" class="bg-[#1a1a1a] w-full transition-all duration-300" style="height: 50%;"></div>
            <div id="eval-bar-white" class="bg-white w-full transition-all duration-300" style="height: 50%;"></div>
            <span id="eval-score-text" class="absolute top-1 left-0 right-0 text-center text-[10px] font-bold text-white drop-shadow-md">0.0</span>
          </div>

          <div class="flex-1 min-w-0 min-h-0 flex items-center justify-center">
             <div id="board-wrapper" class="relative w-full max-h-full border-[3px] border-[#1a1a1a]" style="aspect-ratio: 1 / 1;">
               
               <div id="board" class="absolute inset-0 w-full h-full"></div>
               
               <!-- Overlay de Transparência para Modo Variante -->
               <div id="variant-overlay"></div>
               
               <!-- SVG para Setas do Engine -->
               <svg id="arrow-overlay" viewBox="0 0 100 100" class="absolute inset-0 w-full h-full pointer-events-none z-20">
                 <defs>
                   <marker id="arrowhead-engine" markerWidth="4" markerHeight="4" refX="2.5" refY="2" orient="auto"><polygon points="0 0, 4 2, 0 4" fill="rgba(255, 255, 255, 0.4)" /></marker>
                   <marker id="arrowhead-best" markerWidth="4" markerHeight="4" refX="2.5" refY="2" orient="auto"><polygon points="0 0, 4 2, 0 4" fill="rgba(227, 0, 0, 0.6)" /></marker>
                 </defs>
                 <g id="arrows-group"></g>
               </svg>

               <!-- SVG para Setas Customizadas (Botão Direito) -->
               <svg id="custom-arrow-overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
                 <defs>
                   <marker id="arrowhead-custom" markerWidth="4" markerHeight="4" refX="2.5" refY="2" orient="auto">
                     <polygon points="0 0, 4 2, 0 4" fill="#e30000" />
                   </marker>
                 </defs>
                 <g id="custom-arrows-group"></g>
               </svg>

               <div id="piece-badge-overlay" class="absolute inset-0 pointer-events-none z-30"></div>
             </div>
          </div>
        </div>

        <div id="bottom-player-bar" class="flex items-center justify-between py-1.5 px-1 shrink-0">
          <div class="flex items-center gap-2.5">
            <div id="bottom-avatar" class="w-8 h-8 rounded bg-[#e30000] flex items-center justify-center text-white font-bold text-sm shadow-md">B</div>
            <div>
              <div id="bottom-name" class="text-white font-semibold text-sm leading-tight">Brancas</div>
              <div id="bottom-elo" class="text-xs text-gray-500">Rating: ?</div>
            </div>
          </div>
          <div id="bottom-badge" class="text-xs px-2 py-0.5 rounded bg-[#111111] border border-subtle text-gray-400"></div>
        </div>
      </div>
    </div>

    <!-- Coluna Direita: Painel Flexível -->
    <div class="lg:col-span-5 panel-bg rounded-lg border border-subtle flex flex-col min-h-0 h-full overflow-hidden shadow-2xl">
      <div class="grid grid-cols-2 border-b border-subtle text-sm font-semibold shrink-0 bg-[#0a0a0a]">
        <button id="tab-report" onclick="switchTab('report')" class="py-2.5 text-white border-b-2 border-highlight bg-[#111111] transition-colors">Relatório</button>
        <button id="tab-moves" onclick="switchTab('moves')" class="py-2.5 text-gray-500 hover:text-white transition-colors">Lances</button>
      </div>

      <div class="panel-dark px-4 py-2 flex items-center justify-between border-b border-subtle shrink-0">
        <div class="flex items-center gap-1">
          <button onclick="goToMove(-1)" class="px-3 py-1 rounded bg-[#0a0a0a] hover:bg-[#2b2b2b] border border-subtle text-white text-sm transition">«</button>
          <button onclick="prevMove()" class="px-3 py-1 rounded bg-[#0a0a0a] hover:bg-[#2b2b2b] border border-subtle text-white text-sm transition">‹</button>
          <button onclick="nextMove()" class="px-3 py-1 rounded bg-[#0a0a0a] hover:bg-[#2b2b2b] border border-subtle text-white text-sm transition">›</button>
          <button onclick="goToMove(analysisData ? analysisData.moves.length - 1 : -1)" class="px-3 py-1 rounded bg-[#0a0a0a] hover:bg-[#2b2b2b] border border-subtle text-white text-sm transition">»</button>
        </div>
        <button onclick="flipBoard()" class="px-3 py-1 rounded bg-[#0a0a0a] hover:bg-[#2b2b2b] border border-subtle text-white text-sm transition">⇅ Inverter</button>
      </div>

      <!-- ABA: RELATÓRIO -->
      <div id="view-report" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 relative">
        <div class="panel-dark p-2.5 rounded border border-subtle shrink-0 shadow-inner">
          <div class="text-[10px] text-gray-500 uppercase font-semibold letter-spacing-1">Abertura</div>
          <div id="opening-name" class="text-white text-xs font-medium mt-0.5">Cole um PGN para iniciar</div>
        </div>

        <div class="panel-dark p-1.5 rounded border border-subtle h-24 shrink-0 relative shadow-inner">
          <canvas id="evalChart"></canvas>
        </div>

        <div class="grid grid-cols-3 items-center text-center pt-1 shrink-0">
          <div class="text-left text-[11px] text-gray-500 font-semibold uppercase">Jogadores</div>
          <div class="text-white text-[11px] font-semibold truncate px-1" id="rep-white-name">Brancas</div>
          <div class="text-white text-[11px] font-semibold truncate px-1" id="rep-black-name">Negras</div>
        </div>

        <div class="grid grid-cols-3 items-center text-center py-2 border-y border-subtle shrink-0">
          <div class="text-left text-sm font-bold text-white uppercase">Precisão</div>
          <div><span id="rep-white-acc" class="inline-block bg-white text-black font-extrabold text-sm px-3 py-1 rounded shadow-md">--</span></div>
          <div><span id="rep-black-acc" class="inline-block bg-[#0a0a0a] text-white border border-subtle font-extrabold text-sm px-3 py-1 rounded shadow-md">--</span></div>
        </div>

        <div id="classification-rows" class="flex-1 flex flex-col justify-around text-xs shrink-0 py-1"></div>

        <div class="grid grid-cols-3 items-center text-center pt-2 border-t border-subtle shrink-0">
          <div class="text-left text-xs font-bold text-white uppercase">ELO Estimado</div>
          <div><span id="rep-white-elo" class="inline-block bg-white text-black font-bold text-[11px] px-2.5 py-1 rounded shadow-md">--</span></div>
          <div><span id="rep-black-elo" class="inline-block bg-[#0a0a0a] text-white border border-subtle font-bold text-[11px] px-2.5 py-1 rounded shadow-md">--</span></div>
        </div>
      </div>

      <!-- ABA: LANCES -->
      <div id="view-moves" class="hidden flex-1 overflow-y-auto p-2 relative">
        <table class="w-full text-[13px] text-left">
          <thead class="text-[11px] text-gray-500 border-b border-subtle sticky top-0 bg-[#111111] z-10 uppercase">
            <tr>
              <th class="py-1.5 px-2 w-10">#</th>
              <th class="py-1.5 px-2">Brancas</th>
              <th class="py-1.5 px-2">Negras</th>
            </tr>
          </thead>
          <tbody id="moves-table-body" class="divide-y divide-[#1a1a1a]"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="pgn-modal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 hidden">
    <div class="panel-bg border border-highlight rounded-lg max-w-xl w-full p-5 space-y-4 shadow-[0_0_30px_rgba(227,0,0,0.2)]">
      <div class="flex items-center justify-between">
        <h2 class="text-white font-bold text-lg uppercase tracking-wide">Analisar Partida</h2>
        <button onclick="closePgnModal()" class="text-gray-500 hover:text-highlight text-xl transition">&times;</button>
      </div>
      <textarea id="pgn-input" rows="6" class="w-full bg-[#0a0a0a] border border-subtle focus:border-highlight outline-none rounded p-3 text-sm text-gray-300 font-mono transition" placeholder="Cole o PGN..."></textarea>
      <div class="flex items-center justify-between gap-4">
        <select id="depth-select" class="bg-[#0a0a0a] border border-subtle rounded px-2 py-1.5 text-xs text-gray-300 outline-none focus:border-highlight transition">
          <option value="10">Rápida (Depth 10)</option>
          <option value="12" selected>Padrão (Depth 12)</option>
          <option value="14">Profunda (Depth 14)</option>
        </select>
        <button id="analyze-btn" onclick="submitPgn()" class="bg-highlight hover-bg-highlight text-white font-bold px-5 py-1.5 rounded text-sm transition uppercase tracking-wider shadow-lg">
          Analisar
        </button>
      </div>
      <div id="loading-status" class="hidden text-center text-xs text-highlight font-bold pt-1 uppercase tracking-widest animate-pulse">Calculando Lances...</div>
    </div>
  </div>

  <script>
    let board = null;
    let currentBoardChess = new Chess();
    let analysisData = null;
    let currentPly = -1;
    let orientation = 'white';
    let evalChart = null;

    let isVariation = false;
    let variationMoves = [];
    let variationIndex = -1;
    let evalAbortController = null;

    // Ícones em formato SVG puro e elegantes para as jogadas
    const SVG_ICONS = {
      brilliant: `<svg class="w-full h-full p-[3px]" viewBox="0 0 24 24" fill="currentColor" transform="skewX(-12)"><path d="M5.5 2h3v12h-3V2zm0 15h3v3h-3v-3zm7-15h3v12h-3V2zm0 15h3v3h-3v-3z"/></svg>`,
      great:     `<svg class="w-full h-full p-[3px]" viewBox="0 0 24 24" fill="currentColor" transform="skewX(-12)"><path d="M10.5 2h3v12h-3V2zm0 15h3v3h-3v-3z"/></svg>`,
      best:      `<svg class="w-full h-full p-[3px]" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`,
      excellent: `<svg class="w-full h-full p-[4px]" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>`,
      good:      `<svg class="w-full h-full p-[3px]" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`,
      book:      `<svg class="w-full h-full p-[3px]" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>`,
      inaccuracy:`<svg class="w-full h-full p-[3px]" viewBox="0 0 24 24" fill="currentColor" transform="skewX(-12)"><path d="M8 2C5.79 2 4 3.79 4 6h2c0-1.1.9-2 2-2s2 .9 2 2c0 1.33-2 1.75-2 3.66v1h2V9.66c0-1.5 2-1.75 2-3.66 0-2.21-1.79-4-4-4zm-1 12h2v2H7v-2zm10-12h-2v9h2V2zm0 12h-2v2h2v-2z"/></svg>`,
      missed:    `<svg class="w-full h-full p-[3px]" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm0 18c-4.41 0-8-3.59-8-8 0-1.85.63-3.55 1.69-4.9L16.9 18.31C15.55 19.37 13.85 20 12 20zm6.31-3.1L7.1 5.69C8.45 4.63 10.15 4 12 4c4.41 0 8 3.59 8 8 0 1.85-.63 3.55-1.69 4.9z"/></svg>`,
      mistake:   `<svg class="w-full h-full p-[3px]" viewBox="0 0 24 24" fill="currentColor" transform="skewX(-12)"><path d="M12 2C8.686 2 6 4.686 6 8h3c0-1.654 1.346-3 3-3s3 1.346 3 3c0 2-3 2.625-3 5.5v1.5h3V13.5c0-2.25 3-2.625 3-5.5 0-3.314-2.686-6-6-6zm-1.5 15h3v3h-3v-3z"/></svg>`,
      blunder:   `<svg class="w-full h-full p-[2px]" viewBox="0 0 24 24" fill="currentColor" transform="skewX(-12)"><path d="M9 2C6.79 2 5 3.79 5 6h2c0-1.1.9-2 2-2s2 .9 2 2c0 1.33-2 1.75-2 3.66v1h2V9.66c0-1.5 2-1.75 2-3.66 0-2.21-1.79-4-4-4zm-1 12h2v2H8v-2zm8-12c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 1.33-2 1.75-2 3.66v1h2V9.66c0-1.5 2-1.75 2-3.66 0-2.21-1.79-4-4-4zm-1 12h2v2h-2v-2z"/></svg>`
    };

    const CLASS_META = [
      { key: 'brilliant',  label: 'Brilhante',       badge: '!!', iconHtml: SVG_ICONS.brilliant,  color: '#00a3a3' },
      { key: 'great',      label: 'Ótimo lance',     badge: '!',  iconHtml: SVG_ICONS.great,      color: '#42749e' },
      { key: 'best',       label: 'Melhor',          badge: '★',  iconHtml: SVG_ICONS.best,       color: '#719e2c' },
      { key: 'excellent',  label: 'Excelente',       badge: '👍', iconHtml: SVG_ICONS.excellent,  color: '#719e2c' },
      { key: 'good',       label: 'Bom',             badge: '✓',  iconHtml: SVG_ICONS.good,       color: '#6c8a5f' },
      { key: 'book',       label: 'Livro',           badge: '📖', iconHtml: SVG_ICONS.book,       color: '#8a6845' },
      { key: 'inaccuracy', label: 'Imprecisão',      badge: '?!', iconHtml: SVG_ICONS.inaccuracy, color: '#d6a318' },
      { key: 'missed',     label: 'Chance Perdida',  badge: '0',  iconHtml: SVG_ICONS.missed,     color: '#e3423f' },
      { key: 'mistake',    label: 'Erro',            badge: '?',  iconHtml: SVG_ICONS.mistake,    color: '#c27217' },
      { key: 'blunder',    label: 'Gafe',            badge: '??', iconHtml: SVG_ICONS.blunder,    color: '#b01f1c' }
    ];

    function renderEmptyClassificationTable() {
      const container = document.getElementById('classification-rows');
      container.innerHTML = CLASS_META.map(c => `
        <div class="grid grid-cols-3 items-center py-[1px]">
          <div class="font-semibold text-left" style="color: ${c.color}">${c.label}</div>
          <div class="flex items-center justify-center gap-1 text-white font-bold">
            <span id="count-w-${c.key}" class="text-gray-400">0</span>
            <span class="w-4 h-4 rounded-full flex items-center justify-center text-white shadow-sm" style="background:${c.color}">${c.iconHtml}</span>
          </div>
          <div class="flex items-center justify-center gap-1 text-white font-bold">
            <span id="count-b-${c.key}" class="text-gray-400">0</span>
            <span class="w-4 h-4 rounded-full flex items-center justify-center text-white shadow-sm" style="background:${c.color}">${c.iconHtml}</span>
          </div>
        </div>
      `).join('');
    }

    function initBoard() {
      board = Chessboard('board', {
        position: 'start',
        draggable: true,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDragStart: handleDragStart,
        onDrop: handleDrop,
        onSnapEnd: handleSnapEnd
      });

      const resizeObserver = new ResizeObserver(() => {
        if (board) board.resize();
      });
      resizeObserver.observe(document.getElementById('board-wrapper'));
    }

    function renderPieceBadge(targetSquare, classificationKey) {
      const overlay = document.getElementById('piece-badge-overlay');
      overlay.innerHTML = '';
      if (!targetSquare || !classificationKey) return;

      const meta = CLASS_META.find(c => c.key === classificationKey);
      if (!meta) return;

      const file = targetSquare.charCodeAt(0) - 97;
      const rank = parseInt(targetSquare[1], 10) - 1;
      const col = orientation === 'white' ? file : 7 - file;
      const row = orientation === 'white' ? 7 - rank : rank;

      const leftPct = (col + 1) * 12.5;
      const topPct = row * 12.5;
      const tx = col === 7 ? '-85%' : '-58%';
      const ty = row === 0 ? '-15%' : '-42%';

      const badgeEl = document.createElement('div');
      badgeEl.className = 'piece-classification-badge';
      badgeEl.style.backgroundColor = meta.color;
      badgeEl.style.left = `${leftPct}%`;
      badgeEl.style.top = `${topPct}%`;
      badgeEl.style.transform = `translate(${tx}, ${ty})`;
      badgeEl.innerHTML = meta.iconHtml;

      overlay.appendChild(badgeEl);
    }

    function handleDragStart(source, piece) {
      if (currentBoardChess.game_over()) return false;
      const turn = currentBoardChess.turn();
      if ((turn === 'w' && piece.startsWith('b')) || (turn === 'b' && piece.startsWith('w'))) return false;
      clearCustomArrows();
      return true;
    }

    function handleDrop(source, target) {
      const tempChess = new Chess(currentBoardChess.fen());
      const moveObj = tempChess.move({ from: source, to: target, promotion: 'q' });

      if (moveObj === null) return 'snapback';

      if (!isVariation && analysisData && currentPly + 1 < analysisData.moves.length) {
        const nextMainMove = analysisData.moves[currentPly + 1];
        if (nextMainMove.from === source && nextMainMove.to === target) {
          goToMove(currentPly + 1);
          return;
        }
      }

      currentBoardChess = tempChess;
      enterOrAppendVariation(moveObj, tempChess.fen());
    }

    function handleSnapEnd() {
      board.position(currentBoardChess.fen(), false);
    }

    // Lógica do Modo Variante sem Banner
    async function enterOrAppendVariation(moveObj, newFen) {
      if (!isVariation) {
        isVariation = true;
        variationMoves = [];
        variationIndex = -1;
        document.getElementById('board-wrapper').classList.add('variant-active');
      } else {
        variationMoves = variationMoves.slice(0, variationIndex + 1);
      }

      const entry = { san: moveObj.san, from: moveObj.from, to: moveObj.to, fen: newFen, evalData: null };
      variationMoves.push(entry);
      variationIndex = variationMoves.length - 1;

      highlightSquares(moveObj.from, moveObj.to);
      renderPieceBadge(null, null);
      drawBestMoveArrow(null);
      clearCustomArrows();

      if (evalAbortController) evalAbortController.abort();
      evalAbortController = new AbortController();

      try {
        const res = await fetch('/api/evaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fen: newFen, depth: 12 }),
          signal: evalAbortController.signal
        });
        const ev = await res.json();
        if (res.ok) {
          entry.evalData = ev;
          applyVariationEval(ev);
        }
      } catch (err) {}
    }

    function applyVariationEval(ev) {
      if (!ev) return;
      updateEvalBar(ev.cpWhite, ev.mateWhite);
      drawBestMoveArrow(ev.bestMove, true); 
    }

    function goToVariationStep(idx) {
      if (!isVariation) return;
      if (idx < 0) { exitVariation(); return; }
      variationIndex = Math.min(variationMoves.length - 1, idx);
      const item = variationMoves[variationIndex];
      currentBoardChess.load(item.fen);
      board.position(item.fen);
      highlightSquares(item.from, item.to);
      renderPieceBadge(null, null);
      clearCustomArrows();
      if (item.evalData) applyVariationEval(item.evalData);
    }

    function stepVariation(delta) {
      if (!isVariation) return;
      goToVariationStep(variationIndex + delta);
    }

    function exitVariation() {
      isVariation = false;
      variationMoves = [];
      variationIndex = -1;
      document.getElementById('board-wrapper').classList.remove('variant-active');

      if (analysisData) goToMove(currentPly);
      else {
        currentBoardChess = new Chess();
        board.position('start');
        clearHighlights();
        renderPieceBadge(null, null);
        drawBestMoveArrow(null);
        clearCustomArrows();
        updateEvalBar(0, null);
      }
    }

    function highlightSquares(from, to) {
      clearHighlights();
      if (from && to) {
        $(`#board .square-${from}`).addClass('highlight-move');
        $(`#board .square-${to}`).addClass('highlight-move');
      }
    }

    function clearHighlights() {
      $('#board .square-55d63').removeClass('highlight-move');
    }

    function openPgnModal() { document.getElementById('pgn-modal').classList.remove('hidden'); }
    function closePgnModal() { document.getElementById('pgn-modal').classList.add('hidden'); }

    function switchTab(tab) {
      const isReport = tab === 'report';
      document.getElementById('view-report').classList.toggle('hidden', !isReport);
      document.getElementById('view-moves').classList.toggle('hidden', isReport);
      document.getElementById('tab-report').className = isReport ? 'py-2.5 text-white border-b-2 border-highlight bg-[#111111] transition-colors' : 'py-2.5 text-gray-500 hover:text-white transition-colors';
      document.getElementById('tab-moves').className = !isReport ? 'py-2.5 text-white border-b-2 border-highlight bg-[#111111] transition-colors' : 'py-2.5 text-gray-500 hover:text-white transition-colors';
    }

    async function submitPgn() {
      const pgn = document.getElementById('pgn-input').value;
      const depth = parseInt(document.getElementById('depth-select').value, 10);
      const btn = document.getElementById('analyze-btn');
      const status = document.getElementById('loading-status');

      btn.disabled = true;
      status.classList.remove('hidden');

      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pgn, depth })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Erro na análise');

        analysisData = data;
        exitVariation();

        populateReport(data);
        buildMovesTable(data.moves);
        buildEvalChart(data.moves);
        goToMove(-1);
        closePgnModal();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        status.classList.add('hidden');
      }
    }

    function populateReport(data) {
      document.getElementById('opening-name').textContent = `${data.opening.name} (${data.opening.eco})`;
      document.getElementById('rep-white-name').textContent = data.white.name;
      document.getElementById('rep-black-name').textContent = data.black.name;
      document.getElementById('rep-white-acc').textContent = Number(data.white.accuracy).toFixed(1);
      document.getElementById('rep-black-acc').textContent = Number(data.black.accuracy).toFixed(1);
      document.getElementById('rep-white-elo').textContent = data.white.estimatedElo;
      document.getElementById('rep-black-elo').textContent = data.black.estimatedElo;

      for (const c of CLASS_META) {
        document.getElementById(`count-w-${c.key}`).textContent = data.white.counts[c.key] || 0;
        document.getElementById(`count-w-${c.key}`).className = data.white.counts[c.key] > 0 ? 'text-white' : 'text-gray-600';
        document.getElementById(`count-b-${c.key}`).textContent = data.black.counts[c.key] || 0;
        document.getElementById(`count-b-${c.key}`).className = data.black.counts[c.key] > 0 ? 'text-white' : 'text-gray-600';
      }

      updatePlayerBars();
    }

    function updatePlayerBars() {
      if (!analysisData) return;
      const top = orientation === 'white' ? analysisData.black : analysisData.white;
      const bottom = orientation === 'white' ? analysisData.white : analysisData.black;

      document.getElementById('top-name').textContent = top.name;
      document.getElementById('top-elo').textContent = `Rating: ${top.elo}`;
      document.getElementById('top-avatar').textContent = top.name.charAt(0).toUpperCase();

      document.getElementById('bottom-name').textContent = bottom.name;
      document.getElementById('bottom-elo').textContent = `Rating: ${bottom.elo}`;
      document.getElementById('bottom-avatar').textContent = bottom.name.charAt(0).toUpperCase();
    }

    function buildMovesTable(moves) {
      const tbody = document.getElementById('moves-table-body');
      let html = '';

      for (let i = 0; i < moves.length; i += 2) {
        const w = moves[i];
        const b = moves[i + 1];
        const wMeta = CLASS_META.find(c => c.key === w.classification);
        const bMeta = b ? CLASS_META.find(c => c.key === b.classification) : null;

        html += `
          <tr class="hover:bg-[#1a1a1a] transition-colors">
            <td class="py-1 px-2 text-gray-600 font-mono text-[11px]">${w.moveNumber}.</td>
            <td onclick="goToMove(${i})" id="move-cell-${i}" class="py-1 px-2 cursor-pointer rounded">
              <div class="flex items-center justify-between">
                <span class="text-gray-300 font-semibold">${w.san}</span>
                <span class="w-4 h-4 rounded-full flex items-center justify-center text-white shadow-sm" style="background:${wMeta.color}">${wMeta.iconHtml}</span>
              </div>
            </td>
            <td ${b ? `onclick="goToMove(${i + 1})" id="move-cell-${i + 1}"` : ''} class="py-1 px-2 ${b ? 'cursor-pointer rounded' : ''}">
              ${b ? `
                <div class="flex items-center justify-between">
                  <span class="text-gray-300 font-semibold">${b.san}</span>
                  <span class="w-4 h-4 rounded-full flex items-center justify-center text-white shadow-sm" style="background:${bMeta.color}">${bMeta.iconHtml}</span>
                </div>
              ` : ''}
            </td>
          </tr>
        `;
      }
      tbody.innerHTML = html;
    }

    function buildEvalChart(moves) {
      const ctx = document.getElementById('evalChart').getContext('2d');
      if (evalChart) evalChart.destroy();

      const labels = ['Início', ...moves.map(m => `${m.moveNumber}${m.color === 'w' ? '.' : '...'} ${m.san}`)];
      const values = [0, ...moves.map(m => Math.max(-6, Math.min(6, m.cpWhite / 100)))];

      evalChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data: values, 
            borderColor: '#e30000', 
            borderWidth: 2, 
            pointRadius: 0, 
            pointHoverRadius: 4,
            fill: { target: 'origin', above: 'rgba(255, 255, 255, 0.9)', below: 'rgba(26, 26, 26, 0.9)' },
            tension: 0.2
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          onClick: (_, elements) => { if (elements.length > 0) goToMove(elements[0].index - 1); },
          plugins: { legend: { display: false } },
          scales: { x: { display: false }, y: { min: -6, max: 6, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { display: false } } }
        }
      });
    }

    function goToMove(plyIndex) {
      if (!analysisData) return;

      if (isVariation) {
        exitVariation();
      }

      currentPly = Math.max(-1, Math.min(analysisData.moves.length - 1, plyIndex));

      document.querySelectorAll('[id^="move-cell-"]').forEach(el => {
        el.classList.remove('bg-[#2b2b2b]');
        el.querySelector('span:first-child')?.classList.remove('text-white');
        el.querySelector('span:first-child')?.classList.add('text-gray-300');
      });
      const activeCell = document.getElementById(`move-cell-${currentPly}`);
      if (activeCell) {
        activeCell.classList.add('bg-[#2b2b2b]');
        activeCell.querySelector('span:first-child')?.classList.remove('text-gray-300');
        activeCell.querySelector('span:first-child')?.classList.add('text-white');
      }

      if (currentPly === -1) {
        currentBoardChess = new Chess();
        board.position('start');
        clearHighlights();
        renderPieceBadge(null, null);
        updateEvalBar(analysisData.initialEval.cpWhite, analysisData.initialEval.mateWhite);
        drawBestMoveArrow(analysisData.initialEval.bestMove, false);
        clearCustomArrows();
        document.getElementById('top-badge').textContent = '';
        document.getElementById('bottom-badge').textContent = '';
        return;
      }

      const moveObj = analysisData.moves[currentPly];
      currentBoardChess.load(moveObj.fen);
      board.position(moveObj.fen);
      highlightSquares(moveObj.from, moveObj.to);
      renderPieceBadge(moveObj.to, moveObj.classification);
      updateEvalBar(moveObj.cpWhite, moveObj.mateWhite);
      clearCustomArrows();

      const nextMove = analysisData.moves[currentPly + 1];
      drawBestMoveArrow(nextMove ? nextMove.bestMoveBefore : null, false);

      const meta = CLASS_META.find(c => c.key === moveObj.classification);
      const badgeHtml = `<span style="color:${meta.color}" class="font-bold flex items-center gap-1">${moveObj.san} <span class="w-3 h-3 flex">${meta.iconHtml}</span></span>`;

      const isTopPlayer = (orientation === 'white' && moveObj.color === 'b') || (orientation === 'black' && moveObj.color === 'w');
      document.getElementById('top-badge').innerHTML = isTopPlayer ? badgeHtml : '';
      document.getElementById('bottom-badge').innerHTML = !isTopPlayer ? badgeHtml : '';
      
      if (activeCell) activeCell.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function nextMove() {
      if (isVariation) { if (variationIndex + 1 < variationMoves.length) goToVariationStep(variationIndex + 1); return; }
      if (analysisData) goToMove(currentPly + 1);
    }

    function prevMove() {
      if (isVariation) { stepVariation(-1); return; }
      if (analysisData) goToMove(currentPly - 1);
    }

    function flipBoard() {
      orientation = orientation === 'white' ? 'black' : 'white';
      board.orientation(orientation);
      updatePlayerBars();
      clearCustomArrows(); 

      if (isVariation) {
        const currentVar = variationMoves[variationIndex];
        if (currentVar) {
          highlightSquares(currentVar.from, currentVar.to);
          renderPieceBadge(null, null);
          if (currentVar.evalData) drawBestMoveArrow(currentVar.evalData.bestMove, true);
        }
      } else {
        goToMove(currentPly);
      }
    }

    function updateEvalBar(cpWhite, mateWhite) {
      let whitePercent = 50;
      let label = '0.0';

      if (mateWhite !== null && mateWhite !== undefined) {
        whitePercent = mateWhite >= 0 ? 100 : 0;
        label = `M${Math.abs(mateWhite)}`;
      } else {
        const clamped = Math.max(-800, Math.min(800, cpWhite));
        whitePercent = 50 + (clamped / 800) * 48;
        const pawns = (cpWhite / 100).toFixed(1);
        label = cpWhite > 0 ? `+${pawns}` : pawns;
      }

      document.getElementById('eval-bar-white').style.height = `${whitePercent}%`;
      document.getElementById('eval-bar-black').style.height = `${100 - whitePercent}%`;

      const textEl = document.getElementById('eval-score-text');
      textEl.textContent = label;
      if (whitePercent > 50) {
        textEl.style.top = 'auto'; textEl.style.bottom = '6px'; textEl.style.color = '#1a1a1a';
      } else {
        textEl.style.bottom = 'auto'; textEl.style.top = '6px'; textEl.style.color = '#ffffff';
      }
    }

    // --- LÓGICA DE SETAS DO ENGINE ---
    function squareToCoordsPct(sq) {
      const file = sq.charCodeAt(0) - 97;
      const rank = parseInt(sq[1], 10) - 1;
      const col = orientation === 'white' ? file : 7 - file;
      const row = orientation === 'white' ? 7 - rank : rank;
      return { x: col * 12.5 + 6.25, y: row * 12.5 + 6.25 };
    }

    function drawBestMoveArrow(uciMove, isBestInVariation = false) {
      const group = document.getElementById('arrows-group');
      group.innerHTML = '';
      if (!uciMove || uciMove.length < 4) return;

      const from = squareToCoordsPct(uciMove.slice(0, 2));
      const to = squareToCoordsPct(uciMove.slice(2, 4));

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', from.x);
      line.setAttribute('y1', from.y);
      line.setAttribute('x2', to.x);
      line.setAttribute('y2', to.y);
      line.setAttribute('stroke', isBestInVariation ? 'rgba(227, 0, 0, 0.6)' : 'rgba(255, 255, 255, 0.4)');
      line.setAttribute('stroke-width', '2.5');
      line.setAttribute('stroke-linecap', 'round');
      line.setAttribute('marker-end', isBestInVariation ? 'url(#arrowhead-best)' : 'url(#arrowhead-engine)');
      group.appendChild(line);
    }

    // --- LÓGICA DE SETAS CUSTOMIZADAS (INTERCEPTANDO O BOTÃO DIREITO) ---
    const boardWrapperEl = document.getElementById('board-wrapper');
    const customArrowGroup = document.getElementById('custom-arrows-group');
    let isDrawingArrow = false;
    let startSquare = null;

    function getSquareFromEvent(e) {
      const rect = boardWrapperEl.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      let col = Math.floor((x / rect.width) * 8);
      let row = Math.floor((y / rect.height) * 8);
      
      if(col < 0 || col > 7 || row < 0 || row > 7) return null;

      const file = orientation === 'white' ? col : 7 - col;
      const rank = orientation === 'white' ? 7 - row : row;
      
      return String.fromCharCode(97 + file) + (rank + 1);
    }

    // INTERCEPTADOR DE CLIQUE NA FASE DE CAPTURA (TRUE)
    boardWrapperEl.addEventListener('mousedown', (e) => {
      if (e.button === 2) { 
        e.preventDefault();
        e.stopPropagation(); // Impede a biblioteca ChessboardJS de arrastar a peça
        const sq = getSquareFromEvent(e);
        if (sq) {
          isDrawingArrow = true;
          startSquare = sq;
        }
      } else if (e.button === 0) { 
        clearCustomArrows();
      }
    }, true);

    boardWrapperEl.addEventListener('mouseup', (e) => {
      if (e.button === 2 && isDrawingArrow) {
        e.preventDefault();
        e.stopPropagation();
        isDrawingArrow = false;
        const endSquare = getSquareFromEvent(e);
        
        if (startSquare && endSquare && startSquare !== endSquare) {
          drawCustomArrow(startSquare, endSquare);
        }
        startSquare = null;
      }
    }, true);

    // Evita abrir o menu do sistema
    boardWrapperEl.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    }, true);

    function drawCustomArrow(fromSq, toSq) {
      const existingLine = document.querySelector(`line[data-from="${fromSq}"][data-to="${toSq}"]`);
      if (existingLine) {
        existingLine.remove();
        return;
      }
      const from = squareToCoordsPct(fromSq);
      const to = squareToCoordsPct(toSq);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', from.x);
      line.setAttribute('y1', from.y);
      line.setAttribute('x2', to.x);
      line.setAttribute('y2', to.y);
      line.setAttribute('stroke', '#e30000'); 
      line.setAttribute('stroke-width', '3');
      line.setAttribute('stroke-linecap', 'round');
      line.setAttribute('stroke-opacity', '0.85');
      line.setAttribute('marker-end', 'url(#arrowhead-custom)');
      line.setAttribute('data-from', fromSq);
      line.setAttribute('data-to', toSq);
      
      customArrowGroup.appendChild(line);
    }

    function clearCustomArrows() {
      customArrowGroup.innerHTML = '';
    }

    document.addEventListener('keydown', (e) => {
      if (document.getElementById('pgn-modal').classList.contains('hidden')) {
        if (e.key === 'ArrowRight') nextMove();
        if (e.key === 'ArrowLeft') prevMove();
      }
    });

    renderEmptyClassificationTable();
    initBoard();
  </script>
</body>
</html>
