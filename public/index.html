<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Análise de Partidas - Stockfish</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #161512;
      color: #bababa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .panel-bg { background-color: #262421; }
    .panel-dark { background-color: #1e1c19; }
    .border-subtle { border-color: #363431; }

    .white-1e1d7 { background-color: #eeeed2 !important; color: #769656 !important; }
    .black-3c85d { background-color: #769656 !important; color: #eeeed2 !important; }

    .highlight-move {
      box-shadow: inset 0 0 0 100px rgba(246, 246, 105, 0.42) !important;
    }

    .piece-classification-badge {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 900;
      font-size: 13px;
      line-height: 1;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      pointer-events: none;
      user-select: none;
      transition: all 0.15s ease;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3d3b37; border-radius: 3px; }
  </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex flex-col">

  <header class="panel-bg border-b border-subtle px-6 py-3 shrink-0 flex items-center justify-between z-10">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded bg-[#81b64c] flex items-center justify-center text-white font-bold text-lg">♞</div>
      <span class="text-white font-bold tracking-wide text-lg">CHESS<span class="text-[#81b64c]">ANALYZER</span></span>
    </div>
    <div class="flex items-center gap-3">
      <span class="hidden sm:inline text-xs text-gray-400">Arraste as peças para testar variantes</span>
      <button onclick="openPgnModal()" class="bg-[#81b64c] hover:bg-[#72a341] text-white font-semibold px-4 py-1.5 rounded text-sm transition cursor-pointer shadow">
        + Colar PGN
      </button>
    </div>
  </header>

  <main class="flex-1 w-full max-w-[1500px] mx-auto px-4 py-3 grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6 min-h-0 overflow-hidden">
    
    <!-- Coluna Esquerda: Tabuleiro Flexível (Sem scroll) -->
    <div class="lg:col-span-7 flex flex-col items-center justify-center min-h-0 h-full w-full">
      <div class="w-full flex flex-col h-full justify-center max-w-[75vh]">
        
        <div id="variation-banner" class="hidden mb-1.5 bg-[#252d3a] border border-[#3b82f6]/50 rounded-lg px-3 py-2 flex-col gap-1.5 shrink-0 shadow-lg">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-[#3b82f6] animate-pulse"></span>
              <span class="text-white font-bold text-[11px] uppercase tracking-wider">Modo Variante</span>
              <span id="variation-eval-status" class="text-[11px] text-blue-300 font-mono"></span>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="stepVariation(-1)" class="px-2 py-0.5 rounded bg-[#1e1c19] text-white text-[11px] font-semibold">← Desfazer</button>
              <button onclick="exitVariation()" class="px-2 py-0.5 rounded bg-[#3b82f6] text-white text-[11px] font-bold">↩ Voltar</button>
            </div>
          </div>
          <div id="variation-line-text" class="text-[11px] font-mono text-gray-200 bg-[#161512]/70 px-2 py-1 rounded overflow-x-auto whitespace-nowrap"></div>
        </div>

        <div id="top-player-bar" class="flex items-center justify-between py-1.5 px-1 shrink-0">
          <div class="flex items-center gap-2.5">
            <div id="top-avatar" class="w-8 h-8 rounded bg-[#363431] flex items-center justify-center text-white font-bold text-sm">N</div>
            <div>
              <div id="top-name" class="text-white font-semibold text-sm leading-tight">Negras</div>
              <div id="top-elo" class="text-xs text-gray-400">Rating: ?</div>
            </div>
          </div>
          <div id="top-badge" class="text-xs px-2 py-0.5 rounded bg-[#262421] text-gray-300"></div>
        </div>

        <div class="flex items-stretch gap-2.5 flex-1 min-h-0 min-w-0">
          <div class="w-6 lg:w-7 bg-[#262421] rounded overflow-hidden relative shrink-0 border border-subtle select-none shadow">
            <div id="eval-bar-black" class="bg-[#403d39] w-full transition-all duration-300" style="height: 50%;"></div>
            <div id="eval-bar-white" class="bg-white w-full transition-all duration-300" style="height: 50%;"></div>
            <span id="eval-score-text" class="absolute top-1 left-0 right-0 text-center text-[10px] font-bold text-white drop-shadow">0.0</span>
          </div>

          <!-- Wrapper Dinâmico do Tabuleiro (Preserva 1:1 Aspect Ratio) -->
          <div class="flex-1 min-w-0 min-h-0 flex items-center justify-center">
             <div id="board-wrapper" class="relative w-full max-h-full shadow-xl" style="aspect-ratio: 1 / 1;">
               <div id="board" class="absolute inset-0 w-full h-full"></div>
               <svg id="arrow-overlay" viewBox="0 0 100 100" class="absolute inset-0 w-full h-full pointer-events-none z-20">
                 <defs>
                   <marker id="arrowhead-green" markerWidth="4" markerHeight="4" refX="2.5" refY="2" orient="auto"><polygon points="0 0, 4 2, 0 4" fill="rgba(129, 182, 76, 0.88)" /></marker>
                   <marker id="arrowhead-blue" markerWidth="4" markerHeight="4" refX="2.5" refY="2" orient="auto"><polygon points="0 0, 4 2, 0 4" fill="rgba(59, 130, 246, 0.88)" /></marker>
                 </defs>
                 <g id="arrows-group"></g>
               </svg>
               <div id="piece-badge-overlay" class="absolute inset-0 pointer-events-none z-30"></div>
             </div>
          </div>
        </div>

        <div id="bottom-player-bar" class="flex items-center justify-between py-1.5 px-1 shrink-0">
          <div class="flex items-center gap-2.5">
            <div id="bottom-avatar" class="w-8 h-8 rounded bg-white flex items-center justify-center text-black font-bold text-sm">B</div>
            <div>
              <div id="bottom-name" class="text-white font-semibold text-sm leading-tight">Brancas</div>
              <div id="bottom-elo" class="text-xs text-gray-400">Rating: ?</div>
            </div>
          </div>
          <div id="bottom-badge" class="text-xs px-2 py-0.5 rounded bg-[#262421] text-gray-300"></div>
        </div>
      </div>
    </div>

    <!-- Coluna Direita: Painel Flexível -->
    <div class="lg:col-span-5 panel-bg rounded-lg border border-subtle flex flex-col min-h-0 h-full overflow-hidden shadow-lg">
      <div class="grid grid-cols-2 border-b border-subtle text-sm font-semibold shrink-0">
        <button id="tab-report" onclick="switchTab('report')" class="py-2.5 text-white border-b-2 border-[#81b64c] bg-[#2c2a27]">Relatório</button>
        <button id="tab-moves" onclick="switchTab('moves')" class="py-2.5 text-gray-400 hover:text-white">Lances</button>
      </div>

      <div class="panel-dark px-4 py-2 flex items-center justify-between border-b border-subtle shrink-0">
        <div class="flex items-center gap-1">
          <button onclick="goToMove(-1)" class="px-3 py-1 rounded bg-[#2c2a27] hover:bg-[#3a3733] text-white text-sm">«</button>
          <button onclick="prevMove()" class="px-3 py-1 rounded bg-[#2c2a27] hover:bg-[#3a3733] text-white text-sm">‹</button>
          <button onclick="nextMove()" class="px-3 py-1 rounded bg-[#2c2a27] hover:bg-[#3a3733] text-white text-sm">›</button>
          <button onclick="goToMove(analysisData ? analysisData.moves.length - 1 : -1)" class="px-3 py-1 rounded bg-[#2c2a27] hover:bg-[#3a3733] text-white text-sm">»</button>
        </div>
        <button onclick="flipBoard()" class="px-3 py-1 rounded bg-[#2c2a27] hover:bg-[#3a3733] text-white text-sm">⇅ Inverter</button>
      </div>

      <!-- ABA: RELATÓRIO -->
      <div id="view-report" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 relative">
        <div class="panel-dark p-2.5 rounded border border-subtle shrink-0">
          <div class="text-[10px] text-gray-400 uppercase font-semibold">Abertura</div>
          <div id="opening-name" class="text-white text-xs font-medium mt-0.5">Cole um PGN para iniciar</div>
        </div>

        <div class="panel-dark p-1.5 rounded border border-subtle h-24 shrink-0 relative">
          <canvas id="evalChart"></canvas>
        </div>

        <div class="grid grid-cols-3 items-center text-center pt-1 shrink-0">
          <div class="text-left text-[11px] text-gray-400 font-semibold">Jogadores</div>
          <div class="text-white text-[11px] font-semibold truncate px-1" id="rep-white-name">Brancas</div>
          <div class="text-white text-[11px] font-semibold truncate px-1" id="rep-black-name">Negras</div>
        </div>

        <div class="grid grid-cols-3 items-center text-center py-2 border-y border-subtle shrink-0">
          <div class="text-left text-sm font-bold text-white">Precisão</div>
          <div><span id="rep-white-acc" class="inline-block bg-white text-black font-extrabold text-sm px-3 py-1 rounded">--</span></div>
          <div><span id="rep-black-acc" class="inline-block bg-[#161512] text-white border border-subtle font-extrabold text-sm px-3 py-1 rounded">--</span></div>
        </div>

        <div id="classification-rows" class="flex-1 flex flex-col justify-around text-xs shrink-0 py-1"></div>

        <div class="grid grid-cols-3 items-center text-center pt-2 border-t border-subtle shrink-0">
          <div class="text-left text-xs font-bold text-white">ELO Estimado</div>
          <div><span id="rep-white-elo" class="inline-block bg-white text-black font-bold text-[11px] px-2.5 py-1 rounded">--</span></div>
          <div><span id="rep-black-elo" class="inline-block bg-[#161512] text-white border border-subtle font-bold text-[11px] px-2.5 py-1 rounded">--</span></div>
        </div>
      </div>

      <!-- ABA: LANCES -->
      <div id="view-moves" class="hidden flex-1 overflow-y-auto p-2 relative">
        <table class="w-full text-[13px] text-left">
          <thead class="text-[11px] text-gray-400 border-b border-subtle sticky top-0 bg-[#262421] z-10">
            <tr>
              <th class="py-1.5 px-2 w-10">#</th>
              <th class="py-1.5 px-2">Brancas</th>
              <th class="py-1.5 px-2">Negras</th>
            </tr>
          </thead>
          <tbody id="moves-table-body" class="divide-y divide-[#2e2c28]"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="pgn-modal" class="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
    <div class="panel-bg border border-subtle rounded-lg max-w-xl w-full p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h2 class="text-white font-bold text-lg">Analisar Partida (PGN)</h2>
        <button onclick="closePgnModal()" class="text-gray-400 hover:text-white text-xl">&times;</button>
      </div>
      <textarea id="pgn-input" rows="6" class="w-full panel-dark border border-subtle rounded p-3 text-sm text-white font-mono" placeholder="Cole o PGN..."></textarea>
      <div class="flex items-center justify-between gap-4">
        <select id="depth-select" class="panel-dark border border-subtle rounded px-2 py-1.5 text-xs text-white">
          <option value="10">Rápida (Depth 10)</option>
          <option value="12" selected>Padrão (Depth 12)</option>
          <option value="14">Profunda (Depth 14)</option>
        </select>
        <button id="analyze-btn" onclick="submitPgn()" class="bg-[#81b64c] hover:bg-[#72a341] text-white font-bold px-5 py-1.5 rounded text-sm transition">
          Analisar
        </button>
      </div>
      <div id="loading-status" class="hidden text-center text-xs text-[#81b64c] font-medium pt-1">Calculando lances...</div>
    </div>
  </div>

  <script>
    let board = null;
    let currentBoardChess = new Chess();
    let analysisData = null;
    let currentPly = -1;
    let orientation = 'white';
    let evalChart = null;

    let isVariation = false;
    let variationMoves = [];
    let variationIndex = -1;
    let evalAbortController = null;

    const BOOK_SVG = `<svg viewBox="0 0 24 24" class="w-3.5 h-3.5 fill-white"><path d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>`;

    const CLASS_META = [
      { key: 'brilliant',  label: 'Brilhante',       badge: '!!', iconHtml: '!!',     color: '#1baca6' },
      { key: 'great',      label: 'Ótimo lance',     badge: '!',  iconHtml: '!',      color: '#5c8bb0' },
      { key: 'best',       label: 'Melhor',          badge: '★',  iconHtml: '★',      color: '#96bc4b' },
      { key: 'excellent',  label: 'Excelente',       badge: '👍', iconHtml: '👍',     color: '#96bc4b' },
      { key: 'good',       label: 'Bom',             badge: '✓',  iconHtml: '✓',      color: '#96af8b' },
      { key: 'book',       label: 'Livro',           badge: '📖', iconHtml: BOOK_SVG, color: '#a88865' },
      { key: 'inaccuracy', label: 'Imprecisão',      badge: '?!', iconHtml: '?!',     color: '#f7c631' },
      { key: 'missed',     label: 'Chance Perdida',  badge: '0',  iconHtml: '0',      color: '#ff726f' },
      { key: 'mistake',    label: 'Erro',            badge: '?',  iconHtml: '?',      color: '#e58f2a' },
      { key: 'blunder',    label: 'Gafe',            badge: '??', iconHtml: '??',     color: '#ca3431' }
    ];

    function renderEmptyClassificationTable() {
      const container = document.getElementById('classification-rows');
      container.innerHTML = CLASS_META.map(c => `
        <div class="grid grid-cols-3 items-center py-[1px]">
          <div class="font-semibold text-left" style="color: ${c.color}">${c.label}</div>
          <div class="flex items-center justify-center gap-1 text-white font-bold">
            <span id="count-w-${c.key}">0</span>
            <span class="w-4 h-4 rounded-full text-[9px] flex items-center justify-center text-white font-extrabold" style="background:${c.color}">${c.iconHtml}</span>
          </div>
          <div class="flex items-center justify-center gap-1 text-white font-bold">
            <span id="count-b-${c.key}">0</span>
            <span class="w-4 h-4 rounded-full text-[9px] flex items-center justify-center text-white font-extrabold" style="background:${c.color}">${c.iconHtml}</span>
          </div>
        </div>
      `).join('');
    }

    function initBoard() {
      board = Chessboard('board', {
        position: 'start',
        draggable: true,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDragStart: handleDragStart,
        onDrop: handleDrop,
        onSnapEnd: handleSnapEnd
      });

      // ResizeObserver para garantir que o tabuleiro seja sempre re-renderizado ao redimensionar sem gerar scroll
      const resizeObserver = new ResizeObserver(() => {
        if (board) board.resize();
      });
      resizeObserver.observe(document.getElementById('board-wrapper'));
    }

    function renderPieceBadge(targetSquare, classificationKey) {
      const overlay = document.getElementById('piece-badge-overlay');
      overlay.innerHTML = '';
      if (!targetSquare || !classificationKey) return;

      const meta = CLASS_META.find(c => c.key === classificationKey);
      if (!meta) return;

      const file = targetSquare.charCodeAt(0) - 97;
      const rank = parseInt(targetSquare[1], 10) - 1;
      const col = orientation === 'white' ? file : 7 - file;
      const row = orientation === 'white' ? 7 - rank : rank;

      const leftPct = (col + 1) * 12.5;
      const topPct = row * 12.5;

      const tx = col === 7 ? '-85%' : '-58%';
      const ty = row === 0 ? '-15%' : '-42%';

      const badgeEl = document.createElement('div');
      badgeEl.className = 'piece-classification-badge';
      badgeEl.style.backgroundColor = meta.color;
      badgeEl.style.left = `${leftPct}%`;
      badgeEl.style.top = `${topPct}%`;
      badgeEl.style.transform = `translate(${tx}, ${ty})`;
      badgeEl.innerHTML = meta.iconHtml;

      overlay.appendChild(badgeEl);
    }

    function handleDragStart(source, piece) {
      if (currentBoardChess.game_over()) return false;
      const turn = currentBoardChess.turn();
      if ((turn === 'w' && piece.startsWith('b')) || (turn === 'b' && piece.startsWith('w'))) return false;
      return true;
    }

    function handleDrop(source, target) {
      const tempChess = new Chess(currentBoardChess.fen());
      const moveObj = tempChess.move({ from: source, to: target, promotion: 'q' });

      if (moveObj === null) return 'snapback';

      if (!isVariation && analysisData && currentPly + 1 < analysisData.moves.length) {
        const nextMainMove = analysisData.moves[currentPly + 1];
        if (nextMainMove.from === source && nextMainMove.to === target) {
          goToMove(currentPly + 1);
          return;
        }
      }

      currentBoardChess = tempChess;
      enterOrAppendVariation(moveObj, tempChess.fen());
    }

    function handleSnapEnd() {
      board.position(currentBoardChess.fen(), false);
    }

    async function enterOrAppendVariation(moveObj, newFen) {
      if (!isVariation) {
        isVariation = true;
        variationMoves = [];
        variationIndex = -1;
      } else {
        variationMoves = variationMoves.slice(0, variationIndex + 1);
      }

      const entry = { san: moveObj.san, from: moveObj.from, to: moveObj.to, fen: newFen, evalData: null };
      variationMoves.push(entry);
      variationIndex = variationMoves.length - 1;

      highlightSquares(moveObj.from, moveObj.to);
      renderPieceBadge(null, null);
      renderVariationBanner();
      drawBestMoveArrow(null);

      document.getElementById('variation-eval-status').textContent = 'Calculando...';
      if (evalAbortController) evalAbortController.abort();
      evalAbortController = new AbortController();

      try {
        const res = await fetch('/api/evaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fen: newFen, depth: 12 }),
          signal: evalAbortController.signal
        });
        const ev = await res.json();
        if (res.ok) {
          entry.evalData = ev;
          applyVariationEval(ev);
        }
      } catch (err) {
        if (err.name !== 'AbortError') document.getElementById('variation-eval-status').textContent = '';
      }
    }

    function applyVariationEval(ev) {
      if (!ev) return;
      updateEvalBar(ev.cpWhite, ev.mateWhite);
      drawBestMoveArrow(ev.bestMove, true);

      let scoreStr = '0.0';
      if (ev.mateWhite !== null && ev.mateWhite !== undefined) {
        scoreStr = ev.mateWhite >= 0 ? `+M${Math.abs(ev.mateWhite)}` : `-M${Math.abs(ev.mateWhite)}`;
      } else {
        const p = (ev.cpWhite / 100).toFixed(2);
        scoreStr = ev.cpWhite > 0 ? `+${p}` : p;
      }

      const bestText = ev.bestMove ? ` | Melhor: ${ev.bestMove}` : '';
      document.getElementById('variation-eval-status').textContent = `(${scoreStr}${bestText})`;
    }

    function renderVariationBanner() {
      const banner = document.getElementById('variation-banner');
      if (!isVariation) {
        banner.classList.add('hidden');
        return;
      }
      banner.classList.remove('hidden');
      const startPly = currentPly + 1;

      const lineHtml = variationMoves
        .map((m, idx) => {
          const ply = startPly + idx;
          const moveNum = Math.floor(ply / 2) + 1;
          const prefix = ply % 2 === 0 ? `${moveNum}. ` : idx === 0 ? `${moveNum}... ` : '';
          const activeClass = idx === variationIndex ? 'bg-[#3b82f6] text-white px-1.5 py-0.5 rounded font-bold' : 'text-gray-300 hover:text-white cursor-pointer';
          return `<span onclick="goToVariationStep(${idx})" class="${activeClass}">${prefix}${m.san}</span>`;
        })
        .join(' ');

      document.getElementById('variation-line-text').innerHTML = lineHtml;
    }

    function goToVariationStep(idx) {
      if (!isVariation) return;
      if (idx < 0) { exitVariation(); return; }
      variationIndex = Math.min(variationMoves.length - 1, idx);
      const item = variationMoves[variationIndex];
      currentBoardChess.load(item.fen);
      board.position(item.fen);
      highlightSquares(item.from, item.to);
      renderPieceBadge(null, null);
      renderVariationBanner();
      if (item.evalData) applyVariationEval(item.evalData);
    }

    function stepVariation(delta) {
      if (!isVariation) return;
      goToVariationStep(variationIndex + delta);
    }

    function exitVariation() {
      isVariation = false;
      variationMoves = [];
      variationIndex = -1;
      document.getElementById('variation-banner').classList.add('hidden');
      document.getElementById('variation-eval-status').textContent = '';

      if (analysisData) goToMove(currentPly);
      else {
        currentBoardChess = new Chess();
        board.position('start');
        clearHighlights();
        renderPieceBadge(null, null);
        drawBestMoveArrow(null);
        updateEvalBar(0, null);
      }
    }

    function highlightSquares(from, to) {
      clearHighlights();
      if (from && to) {
        $(`#board .square-${from}`).addClass('highlight-move');
        $(`#board .square-${to}`).addClass('highlight-move');
      }
    }

    function clearHighlights() {
      $('#board .square-55d63').removeClass('highlight-move');
    }

    function openPgnModal() { document.getElementById('pgn-modal').classList.remove('hidden'); }
    function closePgnModal() { document.getElementById('pgn-modal').classList.add('hidden'); }

    function switchTab(tab) {
      const isReport = tab === 'report';
      document.getElementById('view-report').classList.toggle('hidden', !isReport);
      document.getElementById('view-moves').classList.toggle('hidden', isReport);
      document.getElementById('tab-report').className = isReport ? 'py-2.5 text-white border-b-2 border-[#81b64c] bg-[#2c2a27]' : 'py-2.5 text-gray-400 hover:text-white';
      document.getElementById('tab-moves').className = !isReport ? 'py-2.5 text-white border-b-2 border-[#81b64c] bg-[#2c2a27]' : 'py-2.5 text-gray-400 hover:text-white';
    }

    async function submitPgn() {
      const pgn = document.getElementById('pgn-input').value;
      const depth = parseInt(document.getElementById('depth-select').value, 10);
      const btn = document.getElementById('analyze-btn');
      const status = document.getElementById('loading-status');

      btn.disabled = true;
      status.classList.remove('hidden');

      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pgn, depth })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Erro na análise');

        analysisData = data;
        isVariation = false;
        variationMoves = [];
        document.getElementById('variation-banner').classList.add('hidden');

        populateReport(data);
        buildMovesTable(data.moves);
        buildEvalChart(data.moves);
        goToMove(-1);
        closePgnModal();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        status.classList.add('hidden');
      }
    }

    function populateReport(data) {
      document.getElementById('opening-name').textContent = `${data.opening.name} (${data.opening.eco})`;
      document.getElementById('rep-white-name').textContent = data.white.name;
      document.getElementById('rep-black-name').textContent = data.black.name;
      document.getElementById('rep-white-acc').textContent = Number(data.white.accuracy).toFixed(1);
      document.getElementById('rep-black-acc').textContent = Number(data.black.accuracy).toFixed(1);
      document.getElementById('rep-white-elo').textContent = data.white.estimatedElo;
      document.getElementById('rep-black-elo').textContent = data.black.estimatedElo;

      for (const c of CLASS_META) {
        document.getElementById(`count-w-${c.key}`).textContent = data.white.counts[c.key] || 0;
        document.getElementById(`count-b-${c.key}`).textContent = data.black.counts[c.key] || 0;
      }

      updatePlayerBars();
    }

    function updatePlayerBars() {
      if (!analysisData) return;
      const top = orientation === 'white' ? analysisData.black : analysisData.white;
      const bottom = orientation === 'white' ? analysisData.white : analysisData.black;

      document.getElementById('top-name').textContent = top.name;
      document.getElementById('top-elo').textContent = `Rating: ${top.elo}`;
      document.getElementById('top-avatar').textContent = top.name.charAt(0).toUpperCase();

      document.getElementById('bottom-name').textContent = bottom.name;
      document.getElementById('bottom-elo').textContent = `Rating: ${bottom.elo}`;
      document.getElementById('bottom-avatar').textContent = bottom.name.charAt(0).toUpperCase();
    }

    function buildMovesTable(moves) {
      const tbody = document.getElementById('moves-table-body');
      let html = '';

      for (let i = 0; i < moves.length; i += 2) {
        const w = moves[i];
        const b = moves[i + 1];
        const wMeta = CLASS_META.find(c => c.key === w.classification);
        const bMeta = b ? CLASS_META.find(c => c.key === b.classification) : null;

        html += `
          <tr>
            <td class="py-1 px-2 text-gray-500 font-mono text-[11px]">${w.moveNumber}.</td>
            <td onclick="goToMove(${i})" id="move-cell-${i}" class="py-1 px-2 cursor-pointer hover:bg-[#33302c] rounded">
              <div class="flex items-center justify-between">
                <span class="text-white font-semibold">${w.san}</span>
                <span class="w-4 h-4 rounded-full text-[9px] font-bold flex items-center justify-center text-white" style="background:${wMeta.color}">${wMeta.iconHtml}</span>
              </div>
            </td>
            <td ${b ? `onclick="goToMove(${i + 1})" id="move-cell-${i + 1}"` : ''} class="py-1 px-2 ${b ? 'cursor-pointer hover:bg-[#33302c] rounded' : ''}">
              ${b ? `
                <div class="flex items-center justify-between">
                  <span class="text-white font-semibold">${b.san}</span>
                  <span class="w-4 h-4 rounded-full text-[9px] font-bold flex items-center justify-center text-white" style="background:${bMeta.color}">${bMeta.iconHtml}</span>
                </div>
              ` : ''}
            </td>
          </tr>
        `;
      }
      tbody.innerHTML = html;
    }

    function buildEvalChart(moves) {
      const ctx = document.getElementById('evalChart').getContext('2d');
      if (evalChart) evalChart.destroy();

      const labels = ['Início', ...moves.map(m => `${m.moveNumber}${m.color === 'w' ? '.' : '...'} ${m.san}`)];
      const values = [0, ...moves.map(m => Math.max(-6, Math.min(6, m.cpWhite / 100)))];

      evalChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data: values, borderColor: '#ffffff', borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 4,
            fill: { target: 'origin', above: 'rgba(255, 255, 255, 0.85)', below: 'rgba(64, 61, 57, 0.85)' },
            tension: 0.2
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          onClick: (_, elements) => { if (elements.length > 0) goToMove(elements[0].index - 1); },
          plugins: { legend: { display: false } },
          scales: { x: { display: false }, y: { min: -6, max: 6, grid: { color: 'rgba(255,255,255,0.08)' }, ticks: { display: false } } }
        }
      });
    }

    function goToMove(plyIndex) {
      if (!analysisData) return;

      if (isVariation) {
        isVariation = false;
        variationMoves = [];
        variationIndex = -1;
        document.getElementById('variation-banner').classList.add('hidden');
      }

      currentPly = Math.max(-1, Math.min(analysisData.moves.length - 1, plyIndex));

      document.querySelectorAll('[id^="move-cell-"]').forEach(el => el.classList.remove('bg-[#3d3a35]'));
      const activeCell = document.getElementById(`move-cell-${currentPly}`);
      if (activeCell) activeCell.classList.add('bg-[#3d3a35]');

      if (currentPly === -1) {
        currentBoardChess = new Chess();
        board.position('start');
        clearHighlights();
        renderPieceBadge(null, null);
        updateEvalBar(analysisData.initialEval.cpWhite, analysisData.initialEval.mateWhite);
        drawBestMoveArrow(analysisData.initialEval.bestMove, false);
        document.getElementById('top-badge').textContent = '';
        document.getElementById('bottom-badge').textContent = '';
        return;
      }

      const moveObj = analysisData.moves[currentPly];
      currentBoardChess.load(moveObj.fen);
      board.position(moveObj.fen);
      highlightSquares(moveObj.from, moveObj.to);
      renderPieceBadge(moveObj.to, moveObj.classification);
      updateEvalBar(moveObj.cpWhite, moveObj.mateWhite);

      const nextMove = analysisData.moves[currentPly + 1];
      drawBestMoveArrow(nextMove ? nextMove.bestMoveBefore : null, false);

      const meta = CLASS_META.find(c => c.key === moveObj.classification);
      const badgeHtml = `<span style="color:${meta.color}" class="font-bold">${moveObj.san} (${meta.label} ${meta.badge})</span>`;

      const isTopPlayer = (orientation === 'white' && moveObj.color === 'b') || (orientation === 'black' && moveObj.color === 'w');
      document.getElementById('top-badge').innerHTML = isTopPlayer ? badgeHtml : '';
      document.getElementById('bottom-badge').innerHTML = !isTopPlayer ? badgeHtml : '';
      
      // Auto-scroll da aba de lances
      if (activeCell) activeCell.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function nextMove() {
      if (isVariation) { if (variationIndex + 1 < variationMoves.length) goToVariationStep(variationIndex + 1); return; }
      if (analysisData) goToMove(currentPly + 1);
    }

    function prevMove() {
      if (isVariation) { stepVariation(-1); return; }
      if (analysisData) goToMove(currentPly - 1);
    }

    function flipBoard() {
      orientation = orientation === 'white' ? 'black' : 'white';
      board.orientation(orientation);
      updatePlayerBars();

      if (isVariation) {
        const currentVar = variationMoves[variationIndex];
        if (currentVar) {
          highlightSquares(currentVar.from, currentVar.to);
          renderPieceBadge(null, null);
          if (currentVar.evalData) drawBestMoveArrow(currentVar.evalData.bestMove, true);
        }
      } else {
        goToMove(currentPly);
      }
    }

    function updateEvalBar(cpWhite, mateWhite) {
      let whitePercent = 50;
      let label = '0.0';

      if (mateWhite !== null && mateWhite !== undefined) {
        whitePercent = mateWhite >= 0 ? 100 : 0;
        label = `M${Math.abs(mateWhite)}`;
      } else {
        const clamped = Math.max(-800, Math.min(800, cpWhite));
        whitePercent = 50 + (clamped / 800) * 48;
        const pawns = (cpWhite / 100).toFixed(1);
        label = cpWhite > 0 ? `+${pawns}` : pawns;
      }

      document.getElementById('eval-bar-white').style.height = `${whitePercent}%`;
      document.getElementById('eval-bar-black').style.height = `${100 - whitePercent}%`;

      const textEl = document.getElementById('eval-score-text');
      textEl.textContent = label;
      if (whitePercent > 50) {
        textEl.style.top = 'auto'; textEl.style.bottom = '6px'; textEl.style.color = '#161512';
      } else {
        textEl.style.bottom = 'auto'; textEl.style.top = '6px'; textEl.style.color = '#ffffff';
      }
    }

    function squareToCoords(sq) {
      const file = sq.charCodeAt(0) - 97;
      const rank = parseInt(sq[1], 10) - 1;
      const col = orientation === 'white' ? file : 7 - file;
      const row = orientation === 'white' ? 7 - rank : rank;
      return { x: col * 12.5 + 6.25, y: row * 12.5 + 6.25 };
    }

    function drawBestMoveArrow(uciMove, isBlue = false) {
      const group = document.getElementById('arrows-group');
      group.innerHTML = '';
      if (!uciMove || uciMove.length < 4) return;

      const from = squareToCoords(uciMove.slice(0, 2));
      const to = squareToCoords(uciMove.slice(2, 4));

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', from.x);
      line.setAttribute('y1', from.y);
      line.setAttribute('x2', to.x);
      line.setAttribute('y2', to.y);
      line.setAttribute('stroke', isBlue ? 'rgba(59, 130, 246, 0.88)' : 'rgba(129, 182, 76, 0.88)');
      line.setAttribute('stroke-width', '2.4');
      line.setAttribute('stroke-linecap', 'round');
      line.setAttribute('marker-end', isBlue ? 'url(#arrowhead-blue)' : 'url(#arrowhead-green)');
      group.appendChild(line);
    }

    document.addEventListener('keydown', (e) => {
      if (document.getElementById('pgn-modal').classList.contains('hidden')) {
        if (e.key === 'ArrowRight') nextMove();
        if (e.key === 'ArrowLeft') prevMove();
      }
    });

    renderEmptyClassificationTable();
    initBoard();
  </script>
</body>
</html>
